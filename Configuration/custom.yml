---
title: Root Playbook File
description: Runs all of the Playbook files
actions:
  # some changes requires default user access. loading the hive before everything else is required
  - !powerShell:
    command: 'reg load HKU\AME_UserHive_Default C:\Users\Default\NTUSER.DAT'
    oobe: false
    wait: true
  - !writeStatus: { status: "Deleting previous configuration folders" }
  - !powerShell:
    command: '.\STOPFOLDERPROC.ps1'
    exeDir: true
    onUpgrade: true
    wait: true
    runas: currentUserElevated
  # v2.0 migration (Atlas -> EB): carry the service-toggle state hive over to
  # the new HKLM\SOFTWARE\EBOS location and rewrite stored EBDesktop/EBModules
  # paths. Runs on upgrade only; harmless when no legacy install exists.
  - !powerShell:
    command: |
      $oldHive = 'HKLM:\SOFTWARE\AtlasOS'
      $newHive = 'HKLM:\SOFTWARE\EBOS'
      if ((Test-Path $oldHive) -and !(Test-Path "$newHive\Services")) {
        Write-Host 'Migrating AtlasOS service state to EBOS...'
        & reg.exe copy 'HKLM\SOFTWARE\AtlasOS' 'HKLM\SOFTWARE\EBOS' /s /f 2>&1 | Out-Null
        Get-ChildItem -Path "$newHive\Services" -Recurse -ErrorAction SilentlyContinue |
          ForEach-Object {
            $p = (Get-ItemProperty -Path $_.PSPath -Name 'path' -ErrorAction SilentlyContinue).path
            if ($p) {
              $fixed = $p -replace 'AtlasDesktop', 'EBDesktop' -replace 'AtlasModules', 'EBModules'
              if ($fixed -ne $p) { Set-ItemProperty -Path $_.PSPath -Name 'path' -Value $fixed }
            }
          }
        Write-Host 'Migration complete.'
      } else {
        Write-Host 'No legacy AtlasOS hive to migrate.'
      }
    wait: true
    exeDir: true
    oobe: false
    onUpgrade: true
    runas: currentUserElevated
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      # Remove legacy (<=1.5.x) and current folders so the copy below is clean
      Remove-Item -LiteralPath "$windir\AtlasDesktop" -Force -Recurse -ErrorAction SilentlyContinue
      Remove-Item -LiteralPath "$windir\AtlasModules" -Force -Recurse -ErrorAction SilentlyContinue
      Remove-Item -LiteralPath "$windir\EBDesktop" -Force -Recurse -ErrorAction SilentlyContinue
      Remove-Item -LiteralPath "$windir\EBModules" -Force -Recurse -ErrorAction SilentlyContinue
    wait: true
    exeDir: true
    oobe: false
    onUpgrade: true

  - !writeStatus: { status: "Copying files" }
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      @(
          'EBModules',
          'EBDesktop'
      ) | ForEach-Object {
          if (!(Test-Path $_)) { exit 1 }
          Copy-Item -Path $_ -Destination $windir -Force -Recurse
          if (!$?) { exit 2 }
      }
      Start-Process -FilePath """$windir\EBDesktop\6. Advanced Configuration\Process Explorer\Uninstall Process Explorer.cmd""" -ArgumentList "/silent" -WindowStyle Hidden
      Copy-Item -Path 'Themes\*' -Destination """$windir\Resources\Themes""" -Force -Recurse
    weight: 10
    wait: true
    exeDir: true
    handleExitCodes: { "!0": halt }

  # Prevent annoying notifications during deployment
  - !cmd:
    command: "DISABLENOTIFS.cmd"
    exeDir: true
    wait: true
    runas: currentUserElevated
  - !taskKill: { name: "explorer" }
  - !taskKill: { name: "ShellExperienceHost" }
  - !run: { exe: "explorer.exe", runas: "currentUser", wait: false }

  # Configure PowerShell first so that other PowerShell scripts work
  # NGEN - .NET assemblies PowerShell optimization
  - !writeStatus: { status: "Optimizing PowerShell" }
  - !task: { path: 'tweaks\scripts\script-ngen.yml' }
  - !task: { path: 'tweaks\qol\config-powershell.yml' }

  # Disk Cleanup is run first so it can run in the background
  - !writeStatus: { status: "Cleaning up" }
  - !powerShell:
    command: '.\CLEANUP.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set hidden Settings pages
  # Done before everything else as scripts will overwrite it
  - !task: { path: 'tweaks\qol\set-hidden-settings-pages.yml' }

  # Main tasks
  - !writeStatus: { status: "Applying base configuration" }
  - !task: { path: 'ebos\start.yml' }
  - !task: { path: 'ebos\services.yml' }
  - !task: { path: 'ebos\components.yml' }
  - !task: { path: 'ebos\appx.yml' }
  - !task: { path: 'ebos\default.yml' }
  - !task: { path: 'ebos\revert.yml' }
  - !task: { path: "tweaks.yml" }

  # Set hives to HKU default user
  - !writeStatus: { status: "Applying hives..." }
  - !powerShell:
    command: '.\APPLYDUHIVE.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set all the correct paths if there are incorrect ones in the registry
  - !writeStatus: { status: "Cleaning up registry paths" }
  - !powerShell:
    command: '.\SETPATHS.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Unloading the hive
  - !powerShell:
    command: 'reg unload HKU\AME_UserHive_Default'
    oobe: false
    wait: true

  - !writeStatus: { status: "Finalizing EBOS configuration" }

  # Set PowerShell execution policy to RemoteSigned from the previous "Unrestricted"
  # This allows EB OS folder scripts (local) to run while requiring signatures for downloaded scripts
  - !writeStatus: { status: "Securing PowerShell execution policy" }
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
    value: 'ExecutionPolicy'
    data: 'RemoteSigned'
    type: REG_SZ
